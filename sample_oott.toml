[networking]
interface = "eno1" # Network interface to use for scans

[log]
level = "info" # off, error, warn, info, debug, trace

[timings]
wait_between_scans="900" # Wait time between scans (in seconds). This does not include the scan time
arp_sender_timeout="60" # If the ARP sender process takes longer than this (in seconds) it will be stopped (for a class C network - 254 IPs - it should take less than a minute)
arp_scan_duration="300" # How long to wait (in seconds) for response packets on each scan (300 to 600 seconds is a good timeframe for a class B or C network)

[notifications]
method="pushover" # For now just pushover, you can set this to "none" to avoid sending notifications (it will just log)

[notifications.pushover]
token="" # Your pushover token goes here, just copy&paste from their website after creating the app
user_key="" # User key goes here, this is the account wide code for pushover
